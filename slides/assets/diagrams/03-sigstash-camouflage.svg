<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="720" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" style="font-size:22px; font-weight:bold; fill:#1e1e1e;">SigStash — Camouflage Mode</text>
  <text x="400" y="58" text-anchor="middle" style="font-size:14px; fill:#4527a0; font-weight:600;">✅ Maximum stealth · Known Microsoft OID · Evades OID scanners</text>

  <!-- PE File -->
  <rect x="40" y="80" width="720" height="600" rx="8" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#pencil)"/>
  <text x="60" y="105" style="font-size:18px; font-weight:bold; fill:#444;">PE File</text>

  <!-- Headers -->
  <rect x="70" y="118" width="660" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="144" text-anchor="middle" style="font-size:15px; fill:#333;">PE Headers + Sections</text>

  <!-- WIN_CERTIFICATE -->
  <rect x="70" y="175" width="660" height="490" rx="8" fill="#fff" stroke="#78909c" stroke-width="2" filter="url(#pencil)"/>
  <text x="90" y="200" style="font-size:16px; font-weight:bold; fill:#546e7a;">WIN_CERTIFICATE</text>

  <!-- PKCS#7 -->
  <rect x="100" y="210" width="600" height="440" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" filter="url(#pencil)"/>
  <text x="120" y="237" style="font-size:16px; font-weight:bold; fill:#1565c0;">PKCS#7 ContentInfo → SignedData</text>

  <!-- encapContentInfo -->
  <rect x="130" y="248" width="540" height="35" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="400" y="272" text-anchor="middle" style="font-size:14px; fill:#2e7d32;">encapContentInfo (Authenticode image hash)</text>

  <!-- SignerInfo box -->
  <rect x="130" y="295" width="540" height="340" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" filter="url(#pencil)"/>
  <text x="150" y="320" style="font-size:16px; font-weight:bold; fill:#e65100;">SignerInfo [0]</text>

  <!-- signedAttrs -->
  <rect x="155" y="330" width="490" height="35" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="400" y="353" text-anchor="middle" style="font-size:14px; fill:#2e7d32;">signedAttrs + signature  ✓ SIGNED</text>

  <!-- unsignedAttrs -->
  <rect x="155" y="375" width="490" height="248" rx="5" fill="#ffebee" stroke="#ef5350" stroke-width="2" filter="url(#pencil)"/>
  <text x="175" y="398" style="font-size:14px; fill:#c62828; font-weight:bold;">unsignedAttrs  ✗ NOT SIGNED</text>

  <!-- timestamp -->
  <rect x="175" y="408" width="450" height="28" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#pencil)"/>
  <text x="400" y="428" text-anchor="middle" style="font-size:13px; fill:#888;">timestamp counter-signature (normal)</text>

  <!-- SPC_NESTED_SIGNATURE wrapper -->
  <rect x="175" y="446" width="450" height="165" rx="6" fill="#4527a0" stroke="#1a237e" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="400" y="470" text-anchor="middle" style="font-size:15px; font-weight:bold; fill:#e8eaf6;">SPC_NESTED_SIGNATURE</text>
  <text x="400" y="490" text-anchor="middle" style="font-size:11px; fill:#b39ddb; font-family:monospace;">OID: 1.3.6.1.4.1.311.2.4.1</text>
  <text x="400" y="506" text-anchor="middle" style="font-size:12px; fill:#ce93d8;">↑ same OID as signtool sign /as (dual-signing)</text>

  <!-- Fake nested SignedData -->
  <rect x="200" y="516" width="400" height="82" rx="5" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="220" y="536" style="font-size:13px; fill:#4527a0; font-weight:600;">Fake ContentInfo → SignedData</text>
  <text x="220" y="554" style="font-size:11px; fill:#7b1fa2;">certificates: []  ·  signerInfos: []  (empty → no validation)</text>

  <!-- PAYLOAD inside encapContentInfo of the fake nested -->
  <rect x="225" y="564" width="350" height="27" rx="4" fill="#e53935" stroke="#b71c1c" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="584" text-anchor="middle" style="font-size:14px; font-weight:bold; fill:#fff;">★ PAYLOAD  (encapContentInfo.content)</text>

  <!-- Bottom verdict -->
  <rect x="80" y="685" width="640" height="28" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="400" y="705" text-anchor="middle" style="font-size:13px; fill:#311b92; font-weight:bold;">✅ signtool ✓  WinVerifyTrust ✓  SmartScreen ✓  OID scanners ✓  16MB+ capacity</text>
</svg>
