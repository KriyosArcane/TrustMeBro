<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="#fafafa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" style="font-size:20px; font-weight:bold; fill:#1e1e1e;">FormatGhost Trigger Chain</text>
  <text x="400" y="50" text-anchor="middle" style="font-size:13px; fill:#888;">The analyst's own tooling becomes the execution vector</text>

  <!-- Step 1: Analyst action -->
  <rect x="50" y="80" width="260" height="45" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" filter="url(#pencil)"/>
  <text x="180" y="100" text-anchor="middle" style="font-size:14px; fill:#1565c0; font-weight:bold;">Analyst runs:</text>
  <text x="180" y="118" text-anchor="middle" style="font-size:12px; fill:#1565c0; font-family:monospace;">certutil -dump carrier.exe</text>

  <line x1="310" y1="103" x2="360" y2="103" stroke="#666" stroke-width="2"/>

  <!-- Step 2: Parse PKCS7 -->
  <rect x="365" y="80" width="200" height="45" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" filter="url(#pencil)"/>
  <text x="465" y="100" text-anchor="middle" style="font-size:13px; fill:#e65100;">Parses PKCS#7 structure</text>
  <text x="465" y="118" text-anchor="middle" style="font-size:11px; fill:#bf360c;">Finds custom OID in attrs</text>

  <line x1="565" y1="103" x2="615" y2="103" stroke="#666" stroke-width="2"/>

  <!-- Step 3: CryptFormatObject -->
  <rect x="620" y="80" width="150" height="45" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" filter="url(#pencil)"/>
  <text x="695" y="100" text-anchor="middle" style="font-size:12px; fill:#e65100;">CryptFormatObject</text>
  <text x="695" y="118" text-anchor="middle" style="font-size:10px; fill:#bf360c;">for OID display</text>

  <!-- Arrow down -->
  <line x1="695" y1="125" x2="695" y2="165" stroke="#666" stroke-width="2"/>
  <text x="705" y="150" style="font-size:10px; fill:#888;">OID lookup</text>

  <!-- Step 4: Registry -->
  <rect x="440" y="170" width="340" height="55" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" filter="url(#pencil)"/>
  <text x="610" y="192" text-anchor="middle" style="font-size:12px; fill:#4527a0;">Registry: CryptDllFormatObject\{OID}</text>
  <text x="610" y="212" text-anchor="middle" style="font-size:11px; fill:#7b1fa2; font-family:monospace;">Dll = C:\Temp\format_ghost.dll</text>

  <!-- Arrow down -->
  <line x1="610" y1="225" x2="610" y2="260" stroke="#c62828" stroke-width="3"/>
  <text x="620" y="248" style="font-size:11px; fill:#c62828; font-weight:bold;">LoadLibrary!</text>

  <!-- Step 5: DLL loads -->
  <rect x="350" y="265" width="420" height="55" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="560" y="290" text-anchor="middle" style="font-size:15px; fill:#fff; font-weight:bold;">format_ghost.dll loads into certutil.exe</text>
  <text x="560" y="310" text-anchor="middle" style="font-size:12px; fill:#ffcdd2;">FormatObject() receives raw attribute bytes (the payload)</text>

  <!-- Arrow down -->
  <line x1="560" y1="320" x2="560" y2="350" stroke="#666" stroke-width="2"/>

  <!-- Step 6: Payload extracted -->
  <rect x="350" y="355" width="420" height="40" rx="6" fill="#4527a0" stroke="#1a237e" stroke-width="2" filter="url(#pencil)"/>
  <text x="560" y="380" text-anchor="middle" style="font-size:14px; fill:#fff; font-weight:bold;">Payload written to %TEMP%\format_ghost_payload.bin</text>

  <!-- Left side: what the analyst sees -->
  <rect x="30" y="170" width="350" height="230" rx="8" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="205" y="195" text-anchor="middle" style="font-size:14px; font-weight:bold; fill:#555;">What the analyst sees</text>

  <rect x="50" y="210" width="310" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1" filter="url(#pencil)"/>
  <text x="205" y="230" text-anchor="middle" style="font-size:12px; fill:#666; font-family:monospace;">certutil -dump carrier.exe</text>

  <rect x="50" y="250" width="310" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1" filter="url(#pencil)"/>
  <text x="205" y="270" text-anchor="middle" style="font-size:11px; fill:#666;">"CryptFormatObject: No built-in formatting"</text>

  <rect x="50" y="290" width="310" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1" filter="url(#pencil)"/>
  <text x="205" y="310" text-anchor="middle" style="font-size:11px; fill:#666;">Normal certutil output. Nothing suspicious.</text>

  <rect x="60" y="340" width="290" height="40" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="205" y="358" text-anchor="middle" style="font-size:11px; fill:#e65100; font-weight:bold;">The analyst has no idea their process</text>
  <text x="205" y="373" text-anchor="middle" style="font-size:11px; fill:#e65100; font-weight:bold;">loaded and executed attacker code.</text>
</svg>
