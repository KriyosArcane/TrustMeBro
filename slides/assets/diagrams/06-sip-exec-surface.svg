<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="#fafafa" rx="12"/>
  <text x="400" y="30" text-anchor="middle" style="font-size:20px; font-weight:bold; fill:#1e1e1e;">SIP Execution Surface</text>
  <text x="400" y="50" text-anchor="middle" style="font-size:13px; fill:#888;">Your DLL loads in any process that calls WinVerifyTrust</text>

  <!-- Trigger processes -->
  <rect x="30" y="75" width="120" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="90" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">Explorer.exe</text>

  <rect x="165" y="75" width="120" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="225" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">SmartScreen</text>

  <rect x="300" y="75" width="120" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="360" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">Defender</text>

  <rect x="435" y="75" width="120" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="495" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">certutil.exe</text>

  <rect x="570" y="75" width="100" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="620" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">signtool</text>

  <rect x="685" y="75" width="80" height="35" rx="5" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="725" y="98" text-anchor="middle" style="font-size:12px; fill:#1565c0;">AV/EDR</text>

  <!-- Arrow down -->
  <line x1="400" y1="115" x2="400" y2="140" stroke="#666" stroke-width="2"/>
  <text x="410" y="132" style="font-size:10px; fill:#888;">all call WinVerifyTrust</text>

  <!-- WVT box -->
  <rect x="200" y="145" width="400" height="40" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="170" text-anchor="middle" style="font-size:14px; fill:#e65100;">WinVerifyTrust: SIP file-type resolution</text>

  <line x1="400" y1="185" x2="400" y2="210" stroke="#666" stroke-width="2"/>
  <text x="410" y="202" style="font-size:10px; fill:#888;">iterates all IsMyFileType2 GUIDs</text>

  <!-- IsMyFileType2 loop -->
  <rect x="150" y="215" width="500" height="45" rx="6" fill="#ede7f6" stroke="#7e57c2" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="237" text-anchor="middle" style="font-size:13px; fill:#4527a0;">For each registered GUID: call IsMyFileType2(fileName, pGuid)</text>
  <text x="400" y="253" text-anchor="middle" style="font-size:11px; fill:#7b1fa2;">LoadLibrary(Dll) + GetProcAddress(FuncName) + call</text>

  <line x1="400" y1="260" x2="400" y2="285" stroke="#c62828" stroke-width="3"/>
  <text x="410" y="278" style="font-size:11px; fill:#c62828; font-weight:bold;">YOUR GUID HIT</text>

  <!-- Implant DLL -->
  <rect x="200" y="290" width="400" height="55" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="400" y="315" text-anchor="middle" style="font-size:16px; fill:#fff; font-weight:bold;">Your payload DLL loads here</text>
  <text x="400" y="335" text-anchor="middle" style="font-size:12px; fill:#ffcdd2;">DllMain runs in the calling process. Full code execution.</text>

  <!-- Bottom note -->
  <rect x="150" y="360" width="500" height="28" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="400" y="379" text-anchor="middle" style="font-size:12px; fill:#e65100; font-weight:bold;">Triggers: right-click Properties, file copy, signature check, AV scan</text>
</svg>
