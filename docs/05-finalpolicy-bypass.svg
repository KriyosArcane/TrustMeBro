<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#fafafa" rx="12"/>
  <text x="400" y="32" text-anchor="middle" style="font-size:20px; font-weight:bold; fill:#1e1e1e;">FinalPolicy Bypass</text>
  <text x="400" y="52" text-anchor="middle" style="font-size:13px; fill:#888;">One registry write. Every signature check returns success.</text>

  <!-- WVT Chain -->
  <rect x="40" y="75" width="720" height="50" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="105" text-anchor="middle" style="font-size:15px; fill:#1565c0; font-weight:bold;">WinVerifyTrust Execution Chain</text>

  <!-- Steps -->
  <rect x="40" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="84" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">Init</text>

  <rect x="140" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="184" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">Message</text>

  <rect x="240" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="284" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">Signature</text>

  <rect x="340" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="384" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">Certificate</text>

  <rect x="440" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="484" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">CertCheck</text>

  <rect x="540" y="140" width="110" height="50" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="595" y="163" text-anchor="middle" style="font-size:13px; fill:#fff; font-weight:bold;">FinalPolicy</text>
  <text x="595" y="178" text-anchor="middle" style="font-size:10px; fill:#ffcdd2;">THE DECISION</text>

  <rect x="662" y="145" width="88" height="40" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="706" y="170" text-anchor="middle" style="font-size:11px; fill:#555;">Cleanup</text>

  <!-- Arrows between steps -->
  <line x1="128" y1="165" x2="138" y2="165" stroke="#999" stroke-width="1.5"/>
  <line x1="228" y1="165" x2="238" y2="165" stroke="#999" stroke-width="1.5"/>
  <line x1="328" y1="165" x2="338" y2="165" stroke="#999" stroke-width="1.5"/>
  <line x1="428" y1="165" x2="438" y2="165" stroke="#999" stroke-width="1.5"/>
  <line x1="528" y1="165" x2="538" y2="165" stroke="#999" stroke-width="1.5"/>
  <line x1="650" y1="165" x2="660" y2="165" stroke="#999" stroke-width="1.5"/>

  <!-- Normal -->
  <rect x="60" y="220" width="320" height="170" rx="8" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" filter="url(#pencil)"/>
  <text x="220" y="245" text-anchor="middle" style="font-size:14px; font-weight:bold; fill:#2e7d32;">Normal</text>

  <rect x="85" y="260" width="270" height="35" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="220" y="283" text-anchor="middle" style="font-size:13px; fill:#1b5e20;">$Function = SoftpubAuthenticode</text>

  <text x="220" y="315" text-anchor="middle" style="font-size:12px; fill:#2e7d32;">Checks cert chain, EKU, revocation</text>
  <text x="220" y="335" text-anchor="middle" style="font-size:12px; fill:#2e7d32;">Returns TRUST_E_NOSIGNATURE on failure</text>

  <rect x="120" y="352" width="200" height="28" rx="5" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="220" y="371" text-anchor="middle" style="font-size:12px; fill:#1b5e20; font-weight:bold;">Real trust decision</text>

  <!-- Hijacked -->
  <rect x="420" y="220" width="340" height="170" rx="8" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" filter="url(#pencil)"/>
  <text x="590" y="245" text-anchor="middle" style="font-size:14px; font-weight:bold; fill:#c62828;">After Hijack</text>

  <rect x="445" y="260" width="290" height="35" rx="5" fill="#ffebee" stroke="#ef5350" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="590" y="283" text-anchor="middle" style="font-size:13px; fill:#c62828; font-weight:bold;">$Function = SoftpubCleanup</text>

  <text x="590" y="315" text-anchor="middle" style="font-size:12px; fill:#c62828;">Frees memory, returns S_OK</text>
  <text x="590" y="335" text-anchor="middle" style="font-size:12px; fill:#c62828;">No chain check. No EKU check. Nothing.</text>

  <rect x="490" y="352" width="200" height="28" rx="5" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="590" y="371" text-anchor="middle" style="font-size:12px; fill:#fff; font-weight:bold;">Always returns SUCCESS</text>
</svg>
