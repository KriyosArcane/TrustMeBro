<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="620" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" style="font-size:22px; font-weight:bold; fill:#1e1e1e;">SigStash — Direct Mode</text>
  <text x="400" y="58" text-anchor="middle" style="font-size:14px; fill:#2e7d32; font-weight:600;">✅ Signature stays valid · Inside the DER structure</text>

  <!-- PE File -->
  <rect x="40" y="80" width="720" height="510" rx="8" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#pencil)"/>
  <text x="60" y="105" style="font-size:18px; font-weight:bold; fill:#444;">PE File</text>

  <!-- Headers -->
  <rect x="70" y="118" width="660" height="40" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="144" text-anchor="middle" style="font-size:15px; fill:#333;">PE Headers + Sections</text>

  <!-- WIN_CERTIFICATE -->
  <rect x="70" y="175" width="660" height="400" rx="8" fill="#fff" stroke="#78909c" stroke-width="2" filter="url(#pencil)"/>
  <text x="90" y="200" style="font-size:16px; font-weight:bold; fill:#546e7a;">WIN_CERTIFICATE</text>

  <!-- PKCS#7 -->
  <rect x="100" y="210" width="600" height="350" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" filter="url(#pencil)"/>
  <text x="120" y="237" style="font-size:16px; font-weight:bold; fill:#1565c0;">PKCS#7 ContentInfo → SignedData</text>

  <!-- encapContentInfo -->
  <rect x="130" y="250" width="540" height="38" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="400" y="275" text-anchor="middle" style="font-size:14px; fill:#2e7d32;">encapContentInfo (Authenticode image hash)</text>

  <!-- SignerInfo box -->
  <rect x="130" y="300" width="540" height="245" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="2" filter="url(#pencil)"/>
  <text x="150" y="325" style="font-size:16px; font-weight:bold; fill:#e65100;">SignerInfo [0]</text>

  <!-- signedAttrs -->
  <rect x="155" y="335" width="490" height="40" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5" filter="url(#pencil)"/>
  <text x="400" y="356" text-anchor="middle" style="font-size:14px; fill:#2e7d32;">signedAttrs + signature</text>
  <text x="400" y="370" text-anchor="middle" style="font-size:12px; fill:#388e3c; font-weight:bold;">✓ COVERED BY SIGNATURE</text>

  <!-- unsignedAttrs -->
  <rect x="155" y="385" width="490" height="148" rx="5" fill="#ffebee" stroke="#ef5350" stroke-width="2" filter="url(#pencil)"/>
  <text x="175" y="408" style="font-size:14px; fill:#c62828; font-weight:bold;">unsignedAttrs  ✗ NOT SIGNED</text>

  <!-- timestamp -->
  <rect x="175" y="418" width="450" height="30" rx="4" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#pencil)"/>
  <text x="400" y="439" text-anchor="middle" style="font-size:13px; fill:#888;">timestamp counter-signature (normal)</text>

  <!-- PAYLOAD -->
  <rect x="175" y="458" width="450" height="62" rx="6" fill="#e53935" stroke="#b71c1c" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="400" y="484" text-anchor="middle" style="font-size:18px; font-weight:bold; fill:#fff;">★ PAYLOAD</text>
  <text x="400" y="505" text-anchor="middle" style="font-size:12px; fill:#ffcdd2; font-family:monospace;">OID: 1.3.6.1.4.1.311.99.1 → SET { OCTET STRING }</text>

  <!-- Bottom verdict -->
  <rect x="80" y="578" width="640" height="32" rx="6" fill="#e8f5e9" stroke="#4caf50" stroke-width="1.5"/>
  <text x="400" y="600" text-anchor="middle" style="font-size:13px; fill:#1b5e20; font-weight:bold;">✅ Immune to EnableCertPaddingCheck · Valid ASN.1 · 16MB+ capacity · ⚠ Custom OID flaggable</text>
</svg>
