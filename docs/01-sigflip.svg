<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Virgil, Segoe UI, sans-serif">
  <defs>
    <filter id="pencil" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" style="font-size:22px; font-weight:bold; fill:#1e1e1e;">SigFlip (CVE-2013-3900)</text>
  <text x="400" y="58" text-anchor="middle" style="font-size:14px; fill:#e53935; font-weight:600;">❌ Killed by EnableCertPaddingCheck</text>

  <!-- PE File -->
  <rect x="40" y="80" width="720" height="410" rx="8" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#pencil)"/>
  <text x="60" y="105" style="font-size:18px; font-weight:bold; fill:#444;">PE File</text>

  <!-- Headers -->
  <rect x="70" y="120" width="660" height="45" rx="6" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="148" text-anchor="middle" style="font-size:16px; fill:#333;">PE Headers + Sections (.text, .rdata, .rsrc ...)</text>

  <!-- WIN_CERTIFICATE -->
  <rect x="70" y="185" width="660" height="290" rx="8" fill="#fff" stroke="#78909c" stroke-width="2" filter="url(#pencil)"/>
  <text x="90" y="212" style="font-size:16px; font-weight:bold; fill:#546e7a;">WIN_CERTIFICATE</text>

  <!-- PKCS#7 DER blob -->
  <rect x="100" y="225" width="600" height="110" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2" filter="url(#pencil)"/>
  <text x="400" y="260" text-anchor="middle" style="font-size:17px; font-weight:bold; fill:#1565c0;">PKCS#7 SignedData (DER)</text>
  <text x="400" y="285" text-anchor="middle" style="font-size:14px; fill:#1976d2;">SignerInfo → signedAttrs, signature, unsignedAttrs</text>
  <text x="400" y="305" text-anchor="middle" style="font-size:13px; fill:#2e7d32;">← SigFlip does NOT touch any of this</text>

  <!-- End of DER marker -->
  <line x1="100" y1="340" x2="700" y2="340" stroke="#42a5f5" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="400" y="360" text-anchor="middle" style="font-size:13px; fill:#1565c0; font-weight:600;">↑ End of valid PKCS#7 DER ↑</text>

  <!-- PADDING / PAYLOAD -->
  <rect x="100" y="370" width="600" height="90" rx="6" fill="#616161" stroke="#212121" stroke-width="2.5" filter="url(#pencil)"/>
  <text x="400" y="400" text-anchor="middle" style="font-size:20px; font-weight:bold; fill:#fff;">★ PAYLOAD (raw bytes)</text>
  <text x="400" y="425" text-anchor="middle" style="font-size:14px; fill:#bbb;">Cert table padding — between DER end and dwLength</text>
  <text x="400" y="445" text-anchor="middle" style="font-size:13px; fill:#ef9a9a;">Not valid ASN.1 · Encrypted · ~tens of KB max</text>

  <!-- Arrow showing the gap -->
  <line x1="720" y1="335" x2="720" y2="375" stroke="#e53935" stroke-width="3" marker-end="url(#arr)"/>
  <text x="740" y="360" style="font-size:12px; fill:#e53935; font-weight:bold;" transform="rotate(90,740,360)">gap</text>

  <!-- Bottom verdict -->
  <rect x="120" y="480" width="560" height="30" rx="6" fill="#ffebee" stroke="#ef5350" stroke-width="1.5"/>
  <text x="400" y="501" text-anchor="middle" style="font-size:14px; fill:#c62828; font-weight:bold;">EnableCertPaddingCheck rejects padding after DER → signature INVALID</text>
</svg>
